name: Sonde Polymarket
on:
  push:
    branches: [main]
    paths: [".github/workflows/sonde.yml"]
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for u in "https://gamma-api.polymarket.com/markets?limit=2&active=true&closed=false&order=volume24hr&ascending=false" \
                   "https://gamma-api.polymarket.com/markets?limit=1&closed=true" \
                   "https://clob.polymarket.com/time" \
                   "https://data-api.polymarket.com/trades?limit=2"; do
            echo "=== $u"; curl -s -m 20 -w "\nHTTP %{http_code}\n" "$u" | head -c 3000; echo
          done
          TOK=$(curl -s "https://gamma-api.polymarket.com/markets?limit=1&active=true&closed=false&order=volume24hr&ascending=false" | python3 -c "import json,sys;m=json.load(sys.stdin)[0];print(json.loads(m['clobTokenIds'])[0])")
          echo "TOKEN $TOK"
          curl -s -m 20 -w "\nHTTP %{http_code}\n" "https://clob.polymarket.com/book?token_id=$TOK" | head -c 1500; echo
          curl -s -m 20 -w "\nHTTP %{http_code}\n" "https://clob.polymarket.com/prices-history?market=$TOK&interval=1w&fidelity=60" | head -c 600; echo
          curl -s -I -H "Origin: https://vapen69.github.io" "https://clob.polymarket.com/midpoint?token_id=$TOK" | grep -i "access-control\|HTTP"
          curl -s -I -H "Origin: https://vapen69.github.io" "https://gamma-api.polymarket.com/markets?limit=1" | grep -i "access-control\|HTTP"
