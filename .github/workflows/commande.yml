name: Commande

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Que doit faire le bot ?"
        required: true
        type: choice
        options:
          - pause
          - reprendre
          - tout_vendre
          - reinitialiser

concurrency:
  group: commande

permissions:
  contents: write

jobs:
  envoyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Écrire la commande
        run: |
          echo "{\"commande\": \"${{ inputs.action }}\", \"id\": \"${{ github.run_id }}\", \"envoyee_le\": \"$(date -u +%FT%TZ)\"}" > control.json
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add control.json
          git commit -m "Commande : ${{ inputs.action }}"
          git push
