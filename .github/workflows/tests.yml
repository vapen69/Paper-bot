name: Recherche

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["research/**", ".github/workflows/tests.yml"]
  schedule:
    - cron: "41 3 * * 0"   # chaque dimanche

concurrency:
  group: recherche

permissions:
  contents: write

jobs:
  recherche:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: research/cache
          key: recherche-${{ github.run_id }}
          restore-keys: recherche-
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Recherche long terme
        run: python -m research.run_research
      - name: Publier les résultats sur la branche data
        run: |
          mkdir -p /tmp/pub && cd /tmp/pub
          git init -q && git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin data && git checkout -q -b data FETCH_HEAD || git checkout -q -b data
          cp "$GITHUB_WORKSPACE"/data_out/research.* .
          git config user.name "paper-bot" && git config user.email "paper-bot@users.noreply.github.com"
          git add -A && git commit -qm "recherche $(date -u +%F)" && git push -q origin data
      - uses: actions/upload-artifact@v4
        with:
          name: recherche
          path: data_out/research.*
