<title>Paper Bot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Martian+Mono:wght@400;500&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script type="application/json" id="claude-artifacts-manifest">{"permissions": ["full-access", "notifications"]}</script>
<style>
/* Tableau de bord Paper Bot : un seul style pour la crypto, Polymarket et l'appli de bureau.
   Direction (règles studio-motion, voir app/DIRECTION.md) :
   monde = une salle de marché la nuit, encre vert-pétrole teintée, jamais de gris plats ;
   un seul accent, le bleu glacier, qui veut dire « ton bot » (courbes, barres de proba, radar) ;
   vert / rouge réservés au gain et à la perte ; le sable pour la référence « garder du BTC ».
   Typo : Instrument Sans (texte), Martian Mono (grands chiffres), JetBrains Mono (petits chiffres). */
:root{--bg:#081110;--card:#0d1917;--card2:#12211e;--line:#1d302b;--line2:#284039;--ink:#e7f0ea;--mute:#7d958c;--up:#3ddc8a;--down:#ff6b5e;--acc:#7cc4ff;--ref:#c9b48a;--btc:#f2a33a;--eth:#8ea2ff;--glow:61,220,138;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--disp:"Martian Mono","JetBrains Mono",ui-monospace,Consolas,monospace;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --out:cubic-bezier(.16,1,.3,1);--ui:cubic-bezier(.4,0,.2,1);--smooth:cubic-bezier(.65,0,.35,1);color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);padding:env(safe-area-inset-top) 0 40px;overflow-x:clip;min-height:100vh;position:relative}
/* l'ambiance dit le résultat : une seule source douce, verte si on gagne, rouge si on perd */
body::before{content:"";position:fixed;inset:-30vh -10vw auto;height:80vh;pointer-events:none;z-index:0;background:radial-gradient(ellipse 60% 55% at 22% 45%,rgba(var(--glow),.085),transparent 70%);transition:background 1.6s var(--smooth)}
.wrap{position:relative;z-index:1;max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* bascule Crypto | Polymarket */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:14px;flex-wrap:wrap}
.switch{display:flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:99px;max-width:100%;position:relative}
.switch a{position:relative;z-index:1;padding:7px 16px;min-height:36px;border-radius:99px;color:var(--mute);text-decoration:none;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;transition:color .25s}
.switch a.on{color:var(--bg)}
.switch .glis{position:absolute;top:4px;bottom:4px;border-radius:99px;background:var(--ink);transition:left .42s var(--out),width .42s var(--out)}
.switch a i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.45}
.switch a.on i{background:var(--acc);opacity:1}
.horloge{color:var(--mute);font-size:12px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0 2px;gap:8px}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.1px}
h1 em{font-style:normal;color:var(--mute);font-weight:500}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--line);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill.actif{background:rgba(61,220,138,.14);color:var(--up)}
.pill.actif::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:p 1.6s infinite}
.pill.pause{background:rgba(201,180,138,.15);color:var(--ref)}
.pill.coupe-circuit{background:rgba(255,107,94,.14);color:var(--down)}

/* valeur en grand */
.hero{padding:10px 0 4px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:end}
.hero .lab{color:var(--mute);font-size:13px;grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* la valeur : ce qui vient de bouger prend la couleur du sens puis se calme en 0,5 s */
.big{font-family:var(--disp);font-size:clamp(38px,11vw,64px);font-weight:500;line-height:1.05;letter-spacing:-2px;transition:color .5s var(--smooth)}
.big small{font-size:.4em;color:var(--mute);font-weight:400;letter-spacing:0;margin-left:-.25em}
.big.monte{color:var(--up);transition:none}.big.baisse{color:var(--down);transition:none}
.delta{font-family:var(--sans);font-size:16px;font-weight:600;margin-top:6px;white-space:normal;font-variant-numeric:tabular-nums}
.heroSpark{width:220px;height:64px;overflow:hidden}
.heroSpark svg{display:block;width:100%;height:100%}
@media(max-width:520px){.hero{grid-template-columns:minmax(0,1fr)}.heroSpark{width:100%;height:44px;margin-top:6px}}
.up{color:var(--up)}.down{color:var(--down)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none;position:relative}
.dot.on{background:var(--up)}
.dot.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--up);animation:onde 1.6s infinite}
@keyframes onde{from{transform:scale(.4);opacity:.9}to{transform:scale(1.6);opacity:0}}
@keyframes p{50%{opacity:.35}}

/* bandeau des cours (crypto) */
.cours{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) minmax(0,.9fr);gap:8px;margin:14px 0 4px}
@media(max-width:640px){.cours{grid-template-columns:repeat(2,minmax(0,1fr))}.cours .decis{grid-column:1/-1}}
.coin{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px 8px;position:relative;overflow:hidden}
.coin .h{display:flex;justify-content:space-between;align-items:center;gap:6px}
.coin .s{font-weight:800;display:flex;align-items:center;gap:7px}
.coin .s i{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-style:normal;font-size:11px;color:#111;font-weight:800}
.coin .px{font-family:var(--disp);font-size:18px;font-weight:500;letter-spacing:-.5px;margin-top:2px;transition:color .5s var(--smooth)}
.coin .ch{font-size:12px;white-space:normal}
.coin svg{display:block;width:100%;height:38px;margin-top:4px}
.coin .sub{color:var(--mute);font-size:11px}
.decis{display:flex;align-items:center;gap:12px}
.coin svg.ring{width:62px;height:62px;flex:none;margin:0}
.decis b{display:block;font-size:19px;font-family:var(--disp);font-weight:500;letter-spacing:-.5px}
.decis span{color:var(--mute);font-size:12px;line-height:1.3;display:block}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
@media(max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:17px;font-family:var(--disp);font-weight:500;letter-spacing:-.6px;margin-top:2px}
.kpi span{color:var(--mute);font-size:12px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;box-shadow:inset 0 1px 0 rgba(231,240,234,.04),0 10px 30px -18px rgba(0,0,0,.6)}
.card h2{font-size:15px;margin:0 0 10px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 span{color:var(--mute);font-weight:500;font-size:12px;text-align:right}
/* entrée douce, depuis un état déjà lisible */
.entre{animation:monte .6s var(--out) both}
@keyframes monte{from{transform:translateY(12px);opacity:.4}}

/* courbe */
.fig{position:relative;height:240px;touch-action:pan-y}
.fig svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.trace{stroke-dasharray:var(--len);stroke-dashoffset:0}
.trace.dessine{animation:trace 1.5s var(--smooth) both}
@keyframes trace{from{stroke-dashoffset:var(--len)}}
.bout{animation:pouls 1.8s infinite;transform-box:fill-box;transform-origin:center}
@keyframes pouls{0%{r:4;opacity:.9}100%{r:13;opacity:0}}
.bulle{position:absolute;top:6px;pointer-events:none;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:12px;line-height:1.35;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.35);transform:translateX(-50%)}
.bulle[hidden]{display:none}
.bulle .r{color:var(--mute)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.seg{display:flex;gap:3px;background:var(--bg);border-radius:99px;padding:3px}
.seg button{border:0;background:none;padding:4px 11px;border-radius:99px;font-size:12px;font-weight:700;color:var(--mute);cursor:pointer;min-height:28px}
.seg button.on{background:var(--line);color:var(--ink)}

/* positions */
.pos{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 0;border-top:1px solid var(--line)}
.pos:first-child{border-top:0}
.pos .sym{font-weight:800;font-size:16px}
.pos .sub{color:var(--mute);font-size:12px}
.jauge{grid-column:1/-1;position:relative;height:8px;border-radius:4px;background:var(--line);margin-top:7px;overflow:hidden}
.jauge i{position:absolute;top:0;bottom:0;border-radius:4px;transition:left .6s var(--out),width .6s var(--out),background .6s}
.jauge em{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.7}
.flash-up{animation:fu .8s}.flash-down{animation:fd .8s}
@keyframes fu{from{color:var(--up)}}
@keyframes fd{from{color:var(--down)}}
.plus{display:block;width:100%;margin-top:8px;min-height:40px;border:1px solid var(--line2);background:none;border-radius:10px;color:var(--ink);font:600 13px var(--sans);cursor:pointer;transition:background .2s var(--ui)}
.plus:hover{background:var(--line)}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-child{border-top:0}
.row>div:first-child{flex:1}
.row .r{color:var(--mute);font-size:12px}
.row.neuf{animation:neuf 2.4s}
@keyframes neuf{from{background:rgba(var(--glow),.18)}}
.tag{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;margin-right:6px;white-space:nowrap}
.tag.achat{background:rgba(61,220,138,.14);color:var(--up)}.tag.short,.tag.perdu{background:rgba(255,107,94,.14);color:var(--down)}
.tag.vente,.tag.rachat,.tag.neutre{background:rgba(255,255,255,.08)}
.tag.gagne{background:rgba(61,220,138,.14);color:var(--up)}
.tag.pari{background:rgba(124,196,255,.13);color:var(--acc)}
.tag.exp{background:rgba(201,180,138,.14);color:var(--ref)}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
.ctrl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ctrl a{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:12px;background:var(--line);color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;text-align:center;transition:transform .15s,background .2s}
.ctrl a:hover{background:var(--line2)}.ctrl a:active{transform:scale(.97)}
.ctrl a.warn{background:rgba(255,107,94,.12);color:var(--down)}
.note{color:var(--mute);font-size:12px;margin-top:8px}
.log{font-size:12.5px;max-height:260px;overflow:auto}
.log div{padding:4px 0;border-top:1px solid var(--line)}
.log time{color:var(--mute);margin-right:6px}
.verdict{font-size:14px;margin:6px 0 0}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 2px}
.tabs button{flex:none;border:0;border-radius:99px;padding:8px 14px;min-height:38px;background:var(--line);color:var(--ink);font:600 13px var(--sans);cursor:pointer;transition:background .2s var(--ui),color .2s var(--ui)}
.tabs button.on{background:var(--ink);color:var(--bg)}
.err{background:rgba(255,107,94,.12);color:var(--down);border-radius:12px;padding:12px;font-size:14px;margin-top:10px}

/* Polymarket : barre de probabilité, tableau des paris réglés, radar */
.poly .q{font-weight:700;font-size:15px;line-height:1.3;color:var(--ink);text-decoration:none;display:block}
.poly .q:hover{text-decoration:underline}
.ppos{padding:12px 0;border-top:1px solid var(--line)}
.ppos:first-child{border-top:0}
.ppos .haut{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ppos .haut>div:first-child{flex:1}.ppos .haut>div:last-child{flex:none}
.ppos .sub{color:var(--mute);font-size:12px}
.proba{position:relative;height:26px;border-radius:7px;background:var(--line);margin:8px 0 4px;overflow:hidden}
.proba i{position:absolute;left:0;top:0;bottom:0;background:rgba(124,196,255,.42);border-right:2px solid var(--acc);transition:width .8s var(--out)}
.proba em{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.proba b.g{right:auto;left:8px}
.proba b{position:absolute;right:8px;top:0;line-height:26px;font-size:12px;font-family:var(--mono)}
.echelle{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);gap:8px;flex-wrap:wrap}
.chrono{font-family:var(--mono);font-size:12px;color:var(--ink)}
.chrono.bientot{color:var(--acc)}
.mini{height:6px;border-radius:3px;background:var(--line);margin-top:5px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--acc);opacity:.75}
.score{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 2px}
.score i{width:16px;height:16px;border-radius:5px;background:var(--line)}
.score i.g{background:var(--up)}
.score i.p{background:var(--down)}
.score i.o{background:transparent;border:1.5px dashed var(--mute);opacity:.6}
.score i.pop{animation:pop .5s var(--out) both}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.pouls{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));gap:6px;margin-bottom:10px;text-align:center;align-items:stretch}
@media(max-width:520px){.pouls{grid-template-columns:repeat(4,minmax(0,1fr))}.radar{display:none}}
.pouls div{background:var(--bg);border-radius:10px;padding:8px 4px}
.pouls b{display:block;font-size:16px;font-family:var(--disp);font-weight:500;letter-spacing:-.5px}.pouls span{color:var(--mute);font-size:11px;line-height:1.2;display:block}
.radar{width:62px;height:62px;padding:0!important;background:none!important;position:relative}
.radar svg{width:62px;height:62px}
.radar .bal{transform-origin:31px 31px;animation:tour 3s linear infinite}
@keyframes tour{to{transform:rotate(360deg)}}
.feed{font-size:13px;max-height:250px;overflow:auto}
.feed div{padding:6px 0;border-top:1px solid var(--line);display:flex;gap:8px;align-items:baseline}
.feed div:first-child{border-top:0}
.feed div.new{animation:fn 1.8s}
@keyframes fn{from{background:rgba(124,196,255,.16);transform:translateX(-6px)}}
.feed time{color:var(--mute);font-size:11px;flex:none}
.bandeau{border-radius:10px;padding:9px 11px;font-size:13px;margin-bottom:10px;background:rgba(201,180,138,.12);color:var(--ref)}
.bandeau.ok{background:rgba(61,220,138,.12);color:var(--up)}

/* écran d'accueil de l'appli de bureau */
.accueil{max-width:520px;margin:12vh auto 0;text-align:center}
.accueil h1{font-size:24px;margin-bottom:8px}
.accueil p{color:var(--mute)}
.bouton{font-family:var(--sans);display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);font-weight:800;font-size:15px;cursor:pointer;text-decoration:none;margin:6px}
.bouton.sec{background:var(--line);color:var(--ink)}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

</style>

<script>
window.lancerTableau = () => {
/* Tableau de bord Paper Bot : crypto et Polymarket dans une seule page.
   Utilisé tel quel par GitHub Pages (index.html, poly.html) et recopié dans l'appli de bureau (app/).
   Lecture seule : il lit les branches data / data-poly et les prix publics, il ne passe aucun ordre.
   window.PB_TRANSPORT (facultatif) remplace les accès réseau : {json(url), pollPrix, lienVue}. */
(() => {
"use strict";
const T = window.PB_TRANSPORT || {};
const surPages = location.hostname.endsWith("github.io");
const OWNER = surPages ? location.hostname.split(".")[0] : "vapen69";
const REPO = surPages ? (location.pathname.split("/")[1] || "Paper-bot") : "Paper-bot";
const RAW = b => `https://raw.githubusercontent.com/${OWNER}/${REPO}/${b}/`;
const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/`;
const WF = f => `https://github.com/${OWNER}/${REPO}/actions/workflows/${f}`;
const CLOB = "https://clob.polymarket.com";
const KRAKEN = "https://api.kraken.com/0/public/";
const calme = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- outils ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const n = v => { const x = Number(v); return Number.isFinite(x) ? x : 0; };
const fr = (v, d = 2) => n(v).toLocaleString("fr-FR", {minimumFractionDigits: d, maximumFractionDigits: d});
const eur = (v, d = 2) => fr(v, d) + " €";
const usd = (v, d = 2) => fr(v, d) + " $";
const pct = (v, d = 2) => (n(v) >= 0 ? "+" : "") + fr(v, d) + " %";
const prixFmt = p => p >= 100 ? eur(p, 2) : p >= 1 ? eur(p, 4) : eur(p, 6);
const proba = p => fr(n(p) * 100, 1) + " %";
const borne = v => Math.max(0, Math.min(100, n(v) * 100));
const heure = t => { const d = new Date(t); return isNaN(d) ? "" : d.toLocaleString("fr-FR", {day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"}); };
const hms = t => { const d = new Date(t); return isNaN(d) ? "" : d.toLocaleTimeString("fr-FR", {hour: "2-digit", minute: "2-digit"}); };
const lienPoly = u => /^https:\/\/polymarket\.com\/[\w\-./%]*$/.test(String(u || "")) ? String(u) : "";
const duree = s => { s = Math.max(0, Math.floor(s)); const j = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return j ? `${j} j ${h} h ${String(m).padStart(2, "0")}` : `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}`; };

async function jsonUrl(url) {
  if (T.json) return T.json(url);
  try { const r = await fetch(url, {cache: "no-store"}); if (r.ok) return await r.json(); } catch (e) {}
  return null;
}
async function lireData(branche, nom) {
  if (T.json) return T.json(RAW(branche) + nom + "?t=" + Date.now());
  try { const r = await fetch(RAW(branche) + nom + "?t=" + Date.now(), {cache: "no-store"}); if (r.ok) return await r.json(); } catch (e) {}
  try { const r = await fetch(API + nom + "?ref=" + branche, {headers: {Accept: "application/vnd.github.raw+json"}, cache: "no-store"}); if (r.ok) return await r.json(); } catch (e) {}
  return null;
}

/* Nombre qui défile jusqu'à sa nouvelle valeur, avec un halo vert ou rouge. */
function compteur(el, cible, fmt, halo) {
  if (!el) return;
  const depart = el._v;
  el._v = cible;
  if (depart == null || calme || Math.abs(cible - depart) < 1e-9) { el.innerHTML = fmt(cible); return; }
  if (halo && Math.abs(cible - depart) > 1e-6) { el.classList.remove("monte", "baisse"); void el.offsetWidth; el.classList.add(cible > depart ? "monte" : "baisse"); clearTimeout(el._h); el._h = setTimeout(() => el.classList.remove("monte", "baisse"), 450); }
  const t0 = performance.now(), dur = 650;
  cancelAnimationFrame(el._raf);
  const pas = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.innerHTML = fmt(depart + (cible - depart) * e); if (k < 1) el._raf = requestAnimationFrame(pas); };
  el._raf = requestAnimationFrame(pas);
}

      <div class="r">${esc(n(o.nb_trades))} trades · ${esc(n(o.gagnants_pct).toFixed(0))} % gagnants pour un prix moyen payé de ${esc(proba(o.prix_moyen))} · ${esc(n(o.jours_moyens).toFixed(1))} j bloqués · pire série : ${esc(n(o.pire_serie_pertes))} pertes</div>
      ${(s.refus || []).length ? `<div class="r">Refus : ${esc(s.refus.join(" ; "))}</div>` : ""}</div>
      <div class="num" style="text-align:right"><div class="${r >= 0 ? "up" : "down"}">${esc(pct(r))}</div><div class="r">par trade · t ${esc(n(o.t_stat).toFixed(2))}</div><div class="r">100 $ : ${esc(pct(pf.rendement_pct, 1))}</div><div class="r">baisse ${esc(pct(-Math.abs(n(pf.drawdown_max_pct)), 0))}</div></div></div>`; }).join("");
  $("pRecherche").innerHTML = `<div class="bandeau ${c.valide ? "ok" : ""}">${c.valide ? "Stratégie validée par la règle fixée à l'avance" : "Aucune stratégie validée : aucun avantage prouvé, le bot observe à mises réduites"}</div>
    <p class="verdict">${esc(RS.verdict)}</p>
    <p class="note">${esc(n(RS.nb_marches).toLocaleString("fr-FR"))} marchés résolus du ${esc((per.debut || "").slice(0, 10))} au ${esc((per.fin || "").slice(0, 10))}. Résultats ci-dessous : uniquement après le ${esc((per.coupure || "").slice(0, 10))}, période jamais vue pendant le réglage, coûts déduits.${RS.source === "synthetique" ? " DONNÉES FICTIVES." : ""}</p>
    ${rows}<details class="note"><summary>Règle de sélection et limites</summary><p>${esc(RS.regle_selection)}</p>${(RS.avertissements || []).map(a => `<p>· ${esc(a)}</p>`).join("")}</details>`;
}
segPeriode("pSeg", p => { P.per = p; dessineP(); });
$("pTrades").addEventListener("click", ev => { if (ev.target.id !== "pPlus") return; P.tous = !P.tous; renderStateP(); });

async function milieu(jeton) {
  const m = await jsonUrl(`${CLOB}/midpoint?token_id=${encodeURIComponent(jeton)}`);
  const x = Number(m?.mid); if (x > 0 && x < 1) return x;
  const b = await jsonUrl(`${CLOB}/book?token_id=${encodeURIComponent(jeton)}`); if (!b) return null;
  const px = l => (Array.isArray(l) ? l : []).map(z => Number(z.price)).filter(z => z > 0 && z < 1);
  const bids = px(b.bids), asks = px(b.asks);
  if (bids.length && asks.length) { const bb = Math.max(...bids), ba = Math.min(...asks); return ba - bb <= 0.1 ? (bb + ba) / 2 : bb; }
  return bids.length ? Math.max(...bids) : null;
}
async function tickP() {
  if (!P.S || P.occupe || document.hidden) return;
  const jetons = Object.keys(P.S.positions || {}).filter(j => /^\d+$/.test(j)).slice(0, 20);
  if (!jetons.length) return;
  P.occupe = true;
  try { const res = await Promise.all(jetons.map(milieu));
    res.forEach((m, i) => { if (m != null) { P.live[jetons[i]] = m; P.lastTick = Date.now(); } });
    for (const j of Object.keys(P.live)) if (!P.S.positions[j]) delete P.live[j];
  } catch (e) {} finally { P.occupe = false; }
  renderLiveP();
}
async function refreshP() {
  const s = await lireData("data-poly", "state_poly.json");
  if (!s || typeof s !== "object") { if (!P.S) { $("pErr").hidden = false; $("pErr").textContent = "Les données du bot Polymarket ne sont pas encore arrivées (premier démarrage ou connexion lente, réessai automatique)."; } return; }
  $("pErr").hidden = true; P.S = s;
  try { renderStateP(); } catch (e) { console.error(e); }
  tickP();
}
async function refreshRechercheP() { P.RS = await lireData("data-poly", "research_poly.json"); try { renderRechercheP(); } catch (e) { console.error(e); } }

/* ---------- horloge commune ---------- */
setInterval(() => {
  $("horloge").textContent = new Date().toLocaleTimeString("fr-FR");
  compteARebours();
  if (C.S) { const ok = Date.now() - C.lastTick < 20000; $("cDot").className = "dot" + (ok ? " on" : ""); $("cLive").textContent = ok ? "prix en direct" : "connexion…"; if (vue === "crypto") renderLiveC(); }
  if (P.S) { const direct = Date.now() - P.lastTick < 40000, frais = Date.now() - new Date(P.S.maj).getTime() < 180000;
    $("pDot").className = "dot" + (direct || frais ? " on" : ""); $("pLive").textContent = direct ? "prix en direct" : frais ? "bot actif" : "en attente du bot";
    const actif = frais && P.S.statut === "actif"; $("pRadar").style.animationPlayState = actif ? "running" : "paused";
    if (vue === "poly") renderLiveP(); }
  if (T.parSeconde) T.parSeconde(vue === "poly" ? (P.S ? valeurP() : null) : (C.S ? valeurC() : null), vue);
}, 1000);

const ro = new ResizeObserver(es => es.forEach(e => { const w = Math.round(e.contentRect.width); if (e.target._w === w) return; e.target._w = w; if (e.target.id === "cFig" && vue === "crypto") dessineC(); if (e.target.id === "pFig" && vue === "poly") dessineP(); }));
ro.observe($("cFig")); ro.observe($("pFig"));
montreVue(vue, false);
compteARebours();
refreshC(); refreshP(); refreshTestsC(); refreshRechercheP(); historiqueKraken();
setInterval(refreshC, 60000); setInterval(refreshP, 30000); setInterval(tickP, T.pollPrix ? 15000 : 8000);
setInterval(refreshTestsC, 600000); setInterval(refreshRechercheP, 600000);
if (T.pollPrix) { pollKraken(); setInterval(pollKraken, 5000); }
window.PB = {C, P, valeurC, valeurP};
})();

};
</script>
<script>
/* Appli de bureau Paper Bot (artefact Claude installé comme application).
   Dans la fenêtre de l'appli, la page n'a pas le droit d'appeler Internet directement :
   elle lit donc les données publiques avec curl (présent sur Windows 10 et 11), en lecture seule.
   Ailleurs (navigateur, panneau Claude), elle propose d'installer l'appli ou d'ouvrir le tableau en ligne. */
(async () => {
"use strict";
const ACCUEIL = document.getElementById("accueil");
const EN_LIGNE = "https://vapen69.github.io/Paper-bot/";
const URL_OK = /^https:\/\/(raw\.githubusercontent\.com|api\.kraken\.com|clob\.polymarket\.com|api\.github\.com)\/[\w\-./?=&,%]*$/;

function accueil(html) { ACCUEIL.hidden = false; ACCUEIL.innerHTML = html; }
function icone() {
  const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d");
  const r = 56; g.fillStyle = "#081110"; g.beginPath(); g.moveTo(r, 0); g.arcTo(256, 0, 256, 256, r); g.arcTo(256, 256, 0, 256, r); g.arcTo(0, 256, 0, 0, r); g.arcTo(0, 0, 256, 0, r); g.fill();
  const grad = g.createLinearGradient(0, 0, 256, 0); grad.addColorStop(0, "#7cc4ff"); grad.addColorStop(1, "#c9b48a");
  g.strokeStyle = grad; g.lineWidth = 18; g.lineCap = g.lineJoin = "round";
  g.beginPath(); [[40, 180], [92, 128], [130, 156], [214, 70]].forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
  g.fillStyle = "#2fd17a"; g.beginPath(); g.arc(214, 70, 16, 0, 7); g.fill();
  return c.toDataURL("image/png");
}

let desktop = null;
try { desktop = await window.claude?.use?.("desktop"); } catch (e) {}

if (!desktop?.childProcess) {
  let etat = "unavailable";
  try { etat = await desktop?.install?.state() ?? "unavailable"; } catch (e) {}
  accueil(`<h1>Paper Bot</h1>
    <p>Ce tableau de bord devient une vraie appli sur ton PC : une icône sur le bureau, un clic, et tes deux bots s'affichent avec les prix en direct.</p>
    <p>${etat === "installed" ? "L'appli est déjà installée sur cet ordinateur : ouvre-la depuis le menu Démarrer ou ton bureau." : etat === "available" ? "Clique sur le bouton pour l'installer." : "Pour l'installer, ouvre cette page dans l'appli Claude pour ordinateur, puis menu de l'artefact &gt; « Install as app »."}</p>
    ${etat === "available" ? '<button class="bouton" id="installer">Installer l\'appli</button>' : ""}
    <a class="bouton sec" href="${EN_LIGNE}" target="_blank" rel="noopener">Ouvrir le tableau en ligne</a>
    <p class="note">Ici, la page n'a pas le droit de lire Internet : les chiffres ne s'affichent que dans l'appli installée ou sur le lien en ligne.</p>`);
  const b = document.getElementById("installer");
  if (b) b.onclick = async () => { b.disabled = true; try { const r = await desktop.install.request(); if (r === "installed") b.textContent = "Installation lancée"; else b.disabled = false; } catch (e) { b.disabled = false; } };
  return;
}

/* --- dans la fenêtre de l'appli --- */
desktop.app.dock.setIcon(icone()).catch(() => {});
desktop.window.setOptions({width: 1040, height: 900, minWidth: 380, minHeight: 500, backgroundColor: "#081110"}).catch(() => {});

let plateforme = "win32";
try { plateforme = await desktop.os.platform(); } catch (e) {}
const CURL = plateforme === "win32" ? "curl.exe" : "curl";

// file d'attente : 4 appels curl à la fois au plus
let enCours = 0; const attente = [];
const libere = () => { enCours--; const f = attente.shift(); if (f) f(); };
const place = () => enCours < 4 ? (enCours++, Promise.resolve()) : new Promise(r => attente.push(() => { enCours++; r(); }));
let dossier = null;
async function json(url) {
  if (!URL_OK.test(url)) return null;
  await place();
  try {
    const r = await desktop.childProcess.exec(`${CURL} -s -L --compressed --max-time 20 "${url}"`, {timeout: 25000});
    if (r.code === 0 && !r.truncated && r.stdout) return JSON.parse(r.stdout);
    if (r.code === 0 && r.truncated) {
      // gros fichier (la recherche) : on passe par un fichier temporaire
      if (!dossier) dossier = (await desktop.os.tmpdir()).replace(/[\\/]+$/, "");
      const f = `${dossier}${plateforme === "win32" ? "\\" : "/"}paper-bot-${Math.random().toString(36).slice(2)}.json`;
      const r2 = await desktop.childProcess.exec(`${CURL} -s -L --compressed --max-time 30 -o "${f}" "${url}"`, {timeout: 35000});
      if (r2.code !== 0) return null;
      const txt = await desktop.fs.readFile(f, "utf8");
      desktop.fs.rm(f, {force: true}).catch(() => {});
      return JSON.parse(txt);
    }
  } catch (e) { console.warn("lecture impossible", url, e?.message); }
  finally { libere(); }
  return null;
}

async function lance() {
  ACCUEIL.hidden = true;
  let notif = false;
  try { notif = (await desktop.permissions.state("notifications")) === "granted"; } catch (e) {}
  window.PB_TRANSPORT = {
    json, pollPrix: true, lienVue: true,
    notifie: notif ? txt => desktop.notification.show({body: String(txt).slice(0, 300)}).catch(() => {}) : null,
    parSeconde: (v, vue) => { if (v != null) document.title = (vue === "poly" ? v.toLocaleString("fr-FR", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " $" : v.toLocaleString("fr-FR", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " €") + " · Paper Bot"; }
  };
  window.lancerTableau();
}

let acces = "prompt";
try { acces = await desktop.permissions.state("full-access"); } catch (e) {}
if (acces === "granted") { lance(); return; }
if (acces === "unavailable") {
  accueil(`<h1>Paper Bot</h1><p>Claude n'autorise pas encore cette appli à lire Internet sur cet ordinateur. Rouvre l'appli dans quelques secondes ; si ça persiste, utilise le tableau en ligne.</p>
    <a class="bouton sec" href="${EN_LIGNE}" target="_blank" rel="noopener">Ouvrir le tableau en ligne</a>`);
  return;
}
accueil(`<h1>Paper Bot</h1>
  <p>Pour afficher tes bots, l'appli doit lire les données publiques sur Internet (GitHub, Kraken, Polymarket) avec l'outil curl de Windows. Elle ne fait que lire : aucun ordre, aucun fichier modifié.</p>
  <p>Claude va te demander une autorisation « accès complet » (c'est le seul moyen pour une appli de lancer curl). Tu peux aussi accepter les notifications pour être prévenu à chaque trade.</p>
  <button class="bouton" id="autoriser">Autoriser et démarrer</button>
  <button class="bouton sec" id="reglages" hidden>Ouvrir les autorisations</button>
  <a class="bouton sec" href="${EN_LIGNE}" target="_blank" rel="noopener">Tableau en ligne</a>`);
document.getElementById("autoriser").onclick = async () => {
  let m = {};
  try { m = await desktop.permissions.request(["full-access", "notifications"]); } catch (e) {}
  if (m["full-access"] === "granted") return lance();
  document.getElementById("reglages").hidden = false;
};
document.getElementById("reglages").onclick = () => desktop.permissions.manage().then(async () => { if ((await desktop.permissions.state("full-access")) === "granted") lance(); }).catch(() => {});
})();

</script>
